name: CPU acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hardware-free acceptance profile
        env:
          PYTHONPATH: src
        run: python3 simulation/run_cpu_ci.py --report reports/cpu-ci.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-ci-report
          path: reports/cpu-ci.json
          if-no-files-found: error
